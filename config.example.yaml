archive:
  root: /srv/mailarchive
  timezone: Europe/Rome

database:
  path: /srv/mailarchive/state/mailarchive.sqlite3

retention:
  remote_retention_days_default: 365
  required_verified_backups_default: 2

remote_deletion:
  # M11 dry-run selection limits only. Production remote execution is unavailable before M12.
  max_per_run: 10
  max_per_account: 10

accounts:
  personal:
    kind: imap
    enabled: true
    remote_retention_days: 365
    remote_deletion_enabled: false
    # DANGEROUS M12 opt-in for a dedicated non-production account only:
    # remote_deletion_enabled: true
    required_verified_backups: 2
    config_ref: env:MAILARCHIVE_PERSONAL_IMAP_PASSWORD
    imap:
      host: imap.example.invalid
      port: 993
      username: you@example.invalid
      tls_mode: IMAPS
      folders: [INBOX]
      fast_path:
        idle_enabled: true
        reconcile_interval_seconds: 600
        poll_interval_seconds: 90

  work:
    kind: imap
    enabled: true
    remote_retention_days: 730
    remote_deletion_enabled: false
    required_verified_backups: 2
    config_ref: env:MAILARCHIVE_WORK_IMAP_PASSWORD
    imap:
      host: imap.example.invalid
      port: 993
      username: you@example.invalid
      tls_mode: IMAPS
      folders: [INBOX]
      fast_path:
        idle_enabled: true
        reconcile_interval_seconds: 600
        poll_interval_seconds: 90

  personal-gmail:
    kind: gmail
    enabled: true
    remote_retention_days: 365
    remote_deletion_enabled: false
    required_verified_backups: 2
    config_ref: file:/etc/mailarchive/secrets/personal-gmail-token.json
    gmail:
      account_email: user@example.com
      oauth_client_secret_file: /etc/mailarchive/secrets/google-oauth-client.json
      poll_interval_seconds: 90

  legacy-pop3:
    kind: pop3
    enabled: false
    remote_retention_days: 365
    remote_deletion_enabled: false
    required_verified_backups: 2
    config_ref: env:MAILARCHIVE_LEGACY_POP3_PASSWORD
    pop3:
      host: pop.example.invalid
      port: 995
      username: you@example.invalid
      tls_mode: POP3S
      connection_timeout_seconds: 30

spam:
  enabled: true
  classifier: rspamd
  rspamd_endpoint: http://127.0.0.1:11333/checkv2
  suspect_quarantine_days: 365
  spam_quarantine_days: 180
  protect_known_contacts: true
  protect_previous_correspondents: true

search:
  notmuch_enabled: true
  recoll_enabled: true

backup:
  repositories:
    local:
      kind: borg
      enabled: true
      repository_ref: /mnt/mailarchive-backup
      encryption_mode: repokey-blake2
      passphrase_env: MAILARCHIVE_BORG_LOCAL_PASSPHRASE
      verification_policy: borg-archive-data-v1
      command_timeout_seconds: 21600
    remote:
      kind: borg
      enabled: true
      repository_ref: ssh://backup@example.net/./mailarchive
      encryption_mode: repokey-blake2
      passphrase_env: MAILARCHIVE_BORG_REMOTE_PASSPHRASE
      verification_policy: borg-archive-data-v1
      command_timeout_seconds: 21600
