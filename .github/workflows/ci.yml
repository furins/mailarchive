name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install --yes borgbackup dovecot-imapd notmuch recoll poppler-utils
      - run: borg --version
      - run: uv sync --all-groups --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run pyright
      - run: git diff --check
